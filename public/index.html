<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbound Call Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ll-green:#00b580; --ll-magenta:#f40070; --ll-purple:#8a56f3;
  --ll-cyan:#00c5ff;  --ll-yellow:#ffd900;  --ll-black:#191718;
  --ll-surface:#f9fafb; --ll-border:#e5e7eb;
  --muted:#6b7280; --dim:#a1a1aa; --disabled:#d4d4d8;
  --card-shadow:0 1px 3px rgba(25,23,24,.08), 0 16px 36px rgba(25,23,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ll-black);
  background:
    radial-gradient(circle at 14% 0%, rgba(0,181,128,.06), transparent 28%),
    linear-gradient(180deg,#fff 0%, #f9fafb 34%, #f6f7f8 100%);
  min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  border:1px solid rgba(229,231,235,.92); background:rgba(255,255,255,.94);
  box-shadow:var(--card-shadow); border-radius:14px; padding:18px;
  animation:fadeUp 260ms ease both;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;color:#00a777;
  font-family:"Outfit",sans-serif;font-size:.72rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
}
.card-h{font-family:"Nunito";font-size:1.08rem;font-weight:850;line-height:1.05;margin:0 0 2px}
.card-sub{font-size:.87rem;color:var(--muted);font-weight:700;margin:0}

/* ---------------- filter bar ---------------- */
.filter-bar{
  border:1px solid rgba(229,231,235,.92); border-radius:18px;
  background:rgba(255,255,255,.96); box-shadow:var(--card-shadow);
  padding:12px 20px; backdrop-filter:blur(14px);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  position:relative; z-index:40; animation:fadeUp 260ms ease both;
}
.filter-control{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  color:var(--ll-black);font-family:"Nunito",sans-serif;font-size:.93rem;
  font-weight:850;padding:0 16px;box-shadow:0 1px 2px rgba(25,23,24,.04);
  cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease,transform 160ms ease;
  white-space:nowrap;
}
.filter-control:hover,.filter-control[aria-expanded="true"]{
  border-color:rgba(138,86,243,.62); box-shadow:0 7px 18px rgba(138,86,243,.08);
}
.filter-control .chev{transition:transform 160ms ease;color:#9ca3af}
.filter-control[aria-expanded="true"] .chev{transform:rotate(180deg)}
.freshness{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
.pop-wrap{position:relative}

/* ---------------- date popover ---------------- */
.date-popover{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;
  display:none;grid-template-columns:176px minmax(440px,1fr);
  width:min(742px,calc(100vw - 48px));
  border:1px solid rgba(229,231,235,.94);border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);overflow:hidden;
}
.date-popover.open{display:grid}
.quick-select{border-right:1px solid #eef0f2;padding:16px 10px}
.qs-head{
  font-size:.7rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:0 12px 12px;
}
.qs-item{
  font-family:"Nunito",sans-serif;font-size:.91rem;font-weight:750;color:#3f3f46;
  padding:10px 12px;border-radius:9px;background:transparent;cursor:pointer;
  transition:background 140ms ease,color 140ms ease;
}
.qs-item:hover{background:#f4f4f5}
.qs-item.active{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.calendar-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:28px 30px 30px}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  font-family:"Nunito";font-size:.98rem;font-weight:850;margin-bottom:10px;
}
.cal-nav{
  border:none;background:transparent;cursor:pointer;color:var(--muted);
  font-size:1rem;padding:2px 6px;border-radius:6px;line-height:1;
}
.cal-nav:hover{background:#f4f4f5;color:var(--ll-black)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{
  font-size:.78rem;font-weight:800;color:var(--muted);text-align:center;
  padding:4px 0;
}
.cal-day{
  font-size:.9rem;font-weight:720;color:var(--ll-black);height:32px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:0;user-select:none;
}
.cal-day.blank{cursor:default}
.cal-day.dim{color:var(--disabled);cursor:not-allowed}
.cal-day.inrange{background:#f3f4f6}
.cal-day.sel{
  border-radius:10px;background:linear-gradient(135deg,#0fa5b1,#008f9a);
  color:#fff;box-shadow:0 8px 18px rgba(0,143,154,.22);font-weight:850;
}
.cal-hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);font-weight:700;padding-top:4px}

/* ---------------- location popover ---------------- */
.loc-popover{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;display:none;
  width:min(380px,calc(100vw - 48px));border:1px solid rgba(229,231,235,.94);
  border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);
  overflow:hidden;
}
.loc-popover.open{display:block}
.loc-search{
  width:100%;border:none;border-bottom:1px solid #eef0f2;padding:13px 16px;
  font-family:"Nunito";font-size:.91rem;font-weight:700;outline:none;
}
.loc-actions{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid #eef0f2}
.loc-actions button{
  border:none;background:transparent;cursor:pointer;font-family:"Nunito";
  font-size:.8rem;font-weight:850;color:var(--ll-purple);padding:0;
}
.loc-list{max-height:320px;overflow:auto;padding:8px}
.loc-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
  cursor:pointer;font-size:.91rem;font-weight:750;color:#3f3f46;
  transition:background 140ms ease;
}
.loc-item:hover{background:#f4f4f5}
.loc-item.on{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.loc-item .n{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700}
.loc-item.on .n{color:#0094aa}
.cbx{
  width:16px;height:16px;border-radius:5px;border:1.5px solid #d4d4d8;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:11px;color:#fff;
}
.loc-item.on .cbx{background:var(--ll-cyan);border-color:var(--ll-cyan)}

/* ---------------- KPI tiles ---------------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.metric-card{position:relative;overflow:hidden}
.metric-card::after{
  content:"";position:absolute;right:-22px;bottom:-38px;width:112px;height:112px;
  border-radius:999px;opacity:.09;background:currentColor;pointer-events:none;
}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between}
.badge{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,currentColor 12%,white);
}
.chip{
  display:inline-flex;align-items:center;gap:2px;border-radius:999px;
  padding:4px 8px;font-size:.72rem;font-weight:850;
}
.chip.active{color:#007e5c;background:rgba(0,181,128,.10)}
.chip.watch{color:#b90053;background:rgba(244,0,112,.09)}
.mc-label{
  font-family:"Nunito";font-size:.82rem;font-weight:850;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted);margin-top:14px;
}
.mc-value{
  font-family:"Outfit",sans-serif;font-size:clamp(1.65rem,2.4vw,2.35rem);
  font-weight:900;letter-spacing:0;line-height:1;margin-top:2px;
}
.mc-help{font-family:"Nunito";font-size:.87rem;font-weight:700;color:var(--muted);margin-top:6px}
.c-cyan{color:var(--ll-cyan)} .c-green{color:var(--ll-green)}
.c-magenta{color:var(--ll-magenta)} .c-purple{color:var(--ll-purple)}
.c-yellow{color:#d09f00}

/* ---------------- chart ---------------- */
.chart-wrap{position:relative;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:#eef0f2;stroke-width:1}
.axis-txt{font-family:"Nunito";font-size:11px;font-weight:700;fill:var(--muted)}
.tip{
  position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ll-border);
  border-radius:10px;box-shadow:0 8px 22px rgba(25,23,24,.13);padding:9px 11px;
  font-size:.82rem;font-weight:750;opacity:0;transition:opacity 120ms ease;
  white-space:nowrap;z-index:5;
}
.tip .d{font-family:"Outfit";font-weight:800;font-size:.9rem;display:block;margin-bottom:3px}
.tip .v{color:#0094aa;font-weight:850}

/* ---------------- table ---------------- */
.tbl-scroll{overflow:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:.87rem;font-weight:700}
thead th{
  text-align:left;font-size:.7rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);padding:0 12px 10px;
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--ll-black)}
tbody td{padding:11px 12px;border-top:1px solid #f1f2f4;white-space:nowrap}
tbody tr:hover{background:#fafafa}
.mono{font-variant-numeric:tabular-nums}
.pill-status{
  display:inline-block;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:850;
}
.s-completed{color:#007e5c;background:rgba(0,181,128,.10)}
.s-missed{color:#b90053;background:rgba(244,0,112,.09)}
.s-voicemail{color:#8a6d00;background:rgba(255,217,0,.16)}
.s-other{color:#3f3f46;background:#f1f2f4}
.pager{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.82rem;font-weight:750;color:var(--muted)}
.pager button{
  border:1px solid var(--ll-border);background:#fff;border-radius:8px;padding:6px 12px;
  font-family:"Nunito";font-weight:850;font-size:.82rem;cursor:pointer;color:var(--ll-black);
}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-weight:750}
.err{
  border:1px solid rgba(244,0,112,.3);background:rgba(244,0,112,.05);color:#b90053;
  border-radius:14px;padding:18px;font-weight:750;
}
.skel{
  background:linear-gradient(90deg,#f1f2f4 25%,#e9eaec 50%,#f1f2f4 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (max-width:820px){
  .date-popover{grid-template-columns:1fr}
  .calendar-panel{grid-template-columns:1fr;padding:20px}
  .quick-select{border-right:none;border-bottom:1px solid #eef0f2}
}
</style>
</head>
<body data-palette="#00c5ff,#00b580,#8a56f3,#f40070">
<div class="wrap">

  <!-- filter bar -->
  <div class="filter-bar">
    <div class="pop-wrap">
      <button class="filter-control" id="dateBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="dateLabel">Month To Date</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="date-popover" id="datePop">
        <div class="quick-select">
          <div class="qs-head">Quick Select</div>
          <div id="qsList"></div>
        </div>
        <div class="calendar-panel" id="calPanel"></div>
      </div>
    </div>

    <div class="pop-wrap">
      <button class="filter-control" id="locBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01"/>
        </svg>
        <span id="locLabel">All Locations</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="loc-popover" id="locPop">
        <input class="loc-search" id="locSearch" placeholder="Search locations…" />
        <div class="loc-actions">
          <button id="locAll">Select all</button>
          <button id="locNone">Clear</button>
        </div>
        <div class="loc-list" id="locList"></div>
      </div>
    </div>

    <div class="freshness" id="freshness">Loading…</div>
  </div>

  <div id="content"></div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------- constants */
const F = { ID:0, LOC:1, DATE:2, TIME:3, STATUS:4, FROM:5, TO:6, DUR:7 };
const MISSED = new Set(["no-answer","busy","failed"]);
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
const WD = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const PRESETS = ["Today","Yesterday","Week To Date","Month To Date","Year To Date",
                 "Last Week","Last Month","Custom Range"];
const PAGE = 50;

/* ------------------------------------------------------------------ state */
const S = {
  data:null, err:null,
  preset:"Month To Date", start:null, end:null,
  locs:new Set(),            // empty == all
  calMonth:null,             // left-hand month of the two-month view
  pickStage:0,               // 0 = choose start, 1 = choose end
  page:1, sortKey:"date", sortDir:-1,
};

/* ------------------------------------------------------------- date utils */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtShort = s => { const d=parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };

// "Today" means the newest day present in the data, not the wall clock -- the
// sync runs at 07:15 ET, so real today is often legitimately empty.
function anchor(){
  if (S.data && S.data.meta && S.data.meta.last_date) return parse(S.data.meta.last_date);
  return new Date();
}

function rangeFor(preset){
  const t = anchor();
  switch(preset){
    case "Today":        return [iso(t), iso(t)];
    case "Yesterday":    { const y=addDays(t,-1); return [iso(y),iso(y)]; }
    case "Week To Date": { const m=addDays(t,-((t.getDay()+6)%7)); return [iso(m),iso(t)]; }
    case "Month To Date":return [iso(new Date(t.getFullYear(),t.getMonth(),1)), iso(t)];
    case "Year To Date": return [iso(new Date(t.getFullYear(),0,1)), iso(t)];
    case "Last Week":    { const m=addDays(t,-((t.getDay()+6)%7)); return [iso(addDays(m,-7)), iso(addDays(m,-1))]; }
    case "Last Month":   { const f=new Date(t.getFullYear(),t.getMonth()-1,1);
                           return [iso(f), iso(new Date(t.getFullYear(),t.getMonth(),0))]; }
    default:             return [S.start, S.end];
  }
}

/* ------------------------------------------------------------------ fetch */
async function load(){
  try{
    const r = await fetch("/api/data");
    const j = await r.json();
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    S.data = j;
    const [a,b] = rangeFor(S.preset);
    S.start=a; S.end=b;
    S.calMonth = new Date(parse(b).getFullYear(), parse(b).getMonth()-1, 1);
    buildQuickSelect(); buildLocations(); renderFreshness();
  }catch(e){ S.err = String(e.message||e); }
  render();
}

/* ------------------------------------------------------------- filtering */
function filtered(){
  if(!S.data) return [];
  const a=S.start, b=S.end, useLoc=S.locs.size>0;
  return S.data.rows.filter(r =>
    r[F.DATE]>=a && r[F.DATE]<=b && (!useLoc || S.locs.has(r[F.LOC]))
  );
}

/* --------------------------------------------------------------- render */
function render(){
  const c = document.getElementById("content");
  if(S.err){
    c.innerHTML = `<div class="err"><strong>Couldn't load call data.</strong><br>${esc(S.err)}</div>`;
    return;
  }
  if(!S.data){
    c.innerHTML = `<div class="kpi-row">${'<div class="card skel" style="height:150px"></div>'.repeat(4)}</div>
      <div class="card skel" style="height:280px;margin-top:14px"></div>`;
    return;
  }
  const rows = filtered();
  c.innerHTML = kpis(rows) + trend(rows) + table(rows);
  wireChart(rows);
  wireTable();
}

function kpis(rows){
  const total = rows.length;
  const answered = rows.filter(r=>r[F.STATUS]==="completed").length;
  const missed = rows.filter(r=>MISSED.has(r[F.STATUS])).length;
  const vm = rows.filter(r=>r[F.STATUS]==="voicemail").length;
  const durs = rows.map(r=>r[F.DUR]).filter(v=>v!=null && v>0);
  const avg = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length) : 0;
  const rate = total ? Math.round(answered/total*1000)/10 : 0;
  const days = Math.max(1, Math.round((parse(S.end)-parse(S.start))/864e5)+1);
  const perDay = Math.round(total/days*10)/10;

  const tile = (cls,icon,label,value,help,chip) => `
    <div class="card metric-card ${cls}">
      <div class="mc-top">
        <div class="badge">${icon}</div>
        ${chip||""}
      </div>
      <div class="mc-label">${label}</div>
      <div class="mc-value">${value}</div>
      <div class="mc-help">${help}</div>
    </div>`;

  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  return `<div class="kpi-row">
    ${tile("c-cyan", ic('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>'),
      "Inbound Calls", total.toLocaleString(), `${perDay} per day over ${days} day${days===1?"":"s"}`,
      total ? '<span class="chip active">↗ Active</span>' : '<span class="chip watch">↘ Watch</span>')}
    ${tile("c-green", ic('<path d="M20 6L9 17l-5-5"/>'),
      "Answered", answered.toLocaleString(), `${rate}% answer rate`,
      rate>=70 ? '<span class="chip active">↗ Active</span>' : '<span class="chip watch">↘ Watch</span>')}
    ${tile("c-magenta", ic('<path d="M18 6L6 18M6 6l12 12"/>'),
      "Missed", missed.toLocaleString(), `${vm} went to voicemail`,
      missed===0 ? '<span class="chip active">↗ Active</span>' : '<span class="chip watch">↘ Watch</span>')}
    ${tile("c-purple", ic('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
      "Avg Duration", fmtDur(avg), `${durs.length.toLocaleString()} calls with timing`, "")}
  </div>`;
}

function fmtDur(s){
  if(!s) return "—";
  const m=Math.floor(s/60), r=s%60;
  return m ? `${m}m ${String(r).padStart(2,"0")}s` : `${r}s`;
}

function dailySeries(rows){
  const by = new Map();
  for(const r of rows) by.set(r[F.DATE], (by.get(r[F.DATE])||0)+1);
  const out=[]; let d=parse(S.start), end=parse(S.end);
  while(d<=end){ const k=iso(d); out.push({date:k, n:by.get(k)||0}); d=addDays(d,1); }
  return out;
}

function trend(rows){
  const pts = dailySeries(rows);
  return `<div class="card" style="margin-top:14px">
    <div class="eyebrow">Daily Volume</div>
    <div class="card-h">Inbound calls per day</div>
    <p class="card-sub">${fmtShort(S.start)} – ${fmtShort(S.end)} · Eastern Time</p>
    <div class="chart-wrap" id="chartWrap" style="margin-top:14px">
      ${pts.length ? chartSvg(pts) : '<div class="empty">No calls in this range.</div>'}
      <div class="tip" id="tip"></div>
    </div>
  </div>`;
}

function chartSvg(pts){
  const W=1000, H=260, L=44, R=16, T=14, B=30;
  const iw=W-L-R, ih=H-T-B;
  const max = Math.max(4, ...pts.map(p=>p.n));
  const x = i => pts.length===1 ? L+iw/2 : L + (i/(pts.length-1))*iw;
  const y = v => T + ih - (v/max)*ih;

  const ticks=4, grid=[], ylab=[];
  for(let i=0;i<=ticks;i++){
    const v=Math.round(max*i/ticks), yy=y(v);
    grid.push(`<line class="gridline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/>`);
    ylab.push(`<text class="axis-txt" x="${L-9}" y="${yy+4}" text-anchor="end">${v}</text>`);
  }

  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.n).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${T+ih}L${x(0).toFixed(1)},${T+ih}Z`;

  // x labels: at most ~8, always first and last
  const step = Math.max(1, Math.ceil(pts.length/8));
  const xlab = pts.map((p,i)=>
    (i%step===0 || i===pts.length-1)
      ? `<text class="axis-txt" x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtShort(p.date)}</text>` : ""
  ).join("");

  // selective direct label on the peak only
  const pi = pts.reduce((b,p,i)=>p.n>pts[b].n?i:b,0);
  const peak = pts[pi].n>0
    ? `<circle cx="${x(pi)}" cy="${y(pts[pi].n)}" r="4.5" fill="#00c5ff" stroke="#fff" stroke-width="2"/>
       <text class="axis-txt" x="${x(pi)}" y="${y(pts[pi].n)-11}" text-anchor="middle"
             style="font-weight:850;fill:#0094aa">${pts[pi].n}</text>` : "";

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inbound calls per day">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c5ff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#00c5ff" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid.join("")}${ylab.join("")}
    <path d="${area}" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="#00c5ff" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${peak}
    <line id="cross" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="#8a56f3"
          stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    <circle id="dot" r="5.5" fill="#00c5ff" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect id="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
    ${xlab}
  </svg>`;
}

function wireChart(rows){
  const svg=document.querySelector("#chartWrap svg"); if(!svg) return;
  const pts=dailySeries(rows);
  const hit=svg.querySelector("#hit"), cross=svg.querySelector("#cross"),
        dot=svg.querySelector("#dot"), tip=document.getElementById("tip"),
        wrap=document.getElementById("chartWrap");
  const W=1000,H=260,L=44,R=16,T=14,B=30,iw=W-L-R,ih=H-T-B;
  const max=Math.max(4,...pts.map(p=>p.n));
  const X=i=>pts.length===1?L+iw/2:L+(i/(pts.length-1))*iw;
  const Y=v=>T+ih-(v/max)*ih;

  function move(ev){
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)/rect.width*W;
    let i=pts.length===1?0:Math.round((px-L)/iw*(pts.length-1));
    i=Math.max(0,Math.min(pts.length-1,i)); const p=pts[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",".7");
    dot.setAttribute("cx",X(i)); dot.setAttribute("cy",Y(p.n)); dot.setAttribute("opacity","1");
    tip.innerHTML=`<span class="d">${fmtShort(p.date)}</span><span class="v">${p.n}</span> call${p.n===1?"":"s"}`;
    tip.style.opacity="1";
    const tw=tip.offsetWidth, ww=wrap.clientWidth;
    tip.style.left=Math.max(0,Math.min(ww-tw, X(i)/W*ww - tw/2))+"px";
    tip.style.top=Math.max(0,(Y(p.n)/H*wrap.clientHeight) - tip.offsetHeight - 12)+"px";
  }
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",()=>{
    cross.setAttribute("opacity","0"); dot.setAttribute("opacity","0"); tip.style.opacity="0";
  });
}

/* ---------------------------------------------------------------- table */
function table(rows){
  const names = S.data.locations;
  const sorted = rows.slice().sort((a,b)=>{
    const k=S.sortKey, d=S.sortDir;
    let va,vb;
    if(k==="date"){ va=a[F.DATE]+a[F.TIME]; vb=b[F.DATE]+b[F.TIME]; }
    else if(k==="loc"){ va=names[a[F.LOC]]||""; vb=names[b[F.LOC]]||""; }
    else if(k==="dur"){ va=a[F.DUR]??-1; vb=b[F.DUR]??-1; }
    else { va=a[F[k.toUpperCase()]]||""; vb=b[F[k.toUpperCase()]]||""; }
    return va<vb?-d:va>vb?d:0;
  });
  const pages=Math.max(1,Math.ceil(sorted.length/PAGE));
  if(S.page>pages) S.page=pages;
  const slice=sorted.slice((S.page-1)*PAGE, S.page*PAGE);

  const arrow=k=>S.sortKey===k?(S.sortDir===1?" ↑":" ↓"):"";
  const body = slice.length ? slice.map(r=>`<tr>
      <td class="mono">${fmtShort(r[F.DATE])}<span style="color:var(--muted)"> ${r[F.TIME].slice(0,5)}</span></td>
      <td>${esc(names[r[F.LOC]]||r[F.LOC])}</td>
      <td class="mono">${fmtPhone(r[F.FROM])}</td>
      <td class="mono">${fmtPhone(r[F.TO])}</td>
      <td>${statusPill(r[F.STATUS])}</td>
      <td class="mono">${r[F.DUR]==null?"—":fmtDur(r[F.DUR])}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">No calls match these filters.</td></tr>`;

  return `<div class="card" style="margin-top:14px">
    <div class="eyebrow">Call Detail</div>
    <div class="card-h">Every inbound call</div>
    <p class="card-sub">${rows.length.toLocaleString()} call${rows.length===1?"":"s"} · click a column to sort</p>
    <div class="tbl-scroll" style="margin-top:12px">
      <table>
        <thead><tr>
          <th data-k="date">When${arrow("date")}</th>
          <th data-k="loc">Location${arrow("loc")}</th>
          <th data-k="from">From${arrow("from")}</th>
          <th data-k="to">Routed To${arrow("to")}</th>
          <th data-k="status">Status${arrow("status")}</th>
          <th data-k="dur">Duration${arrow("dur")}</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev" ${S.page<=1?"disabled":""}>Previous</button>
      <span>Page ${S.page} of ${pages}</span>
      <button id="next" ${S.page>=pages?"disabled":""}>Next</button>
    </div>
  </div>`;
}

function wireTable(){
  document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(S.sortKey===k) S.sortDir*=-1; else { S.sortKey=k; S.sortDir=k==="date"?-1:1; }
    render();
  });
  const p=document.getElementById("prev"), n=document.getElementById("next");
  if(p) p.onclick=()=>{ S.page--; render(); };
  if(n) n.onclick=()=>{ S.page++; render(); };
}

function statusPill(s){
  const cls = s==="completed" ? "s-completed"
            : MISSED.has(s)   ? "s-missed"
            : s==="voicemail" ? "s-voicemail" : "s-other";
  const label = s==="completed" ? "Answered"
              : s==="no-answer" ? "No answer"
              : s ? s.charAt(0).toUpperCase()+s.slice(1) : "Unknown";
  return `<span class="pill-status ${cls}">${esc(label)}</span>`;
}

function fmtPhone(p){
  if(!p) return "—";
  const d=p.replace(/\D/g,"");
  if(d.length===11 && d[0]==="1") return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p;
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------------------------------------ freshness */
function renderFreshness(){
  const m=S.data.meta;
  const el=document.getElementById("freshness");
  if(!m.last_sync){ el.textContent=""; return; }
  const d=new Date(m.last_sync);
  el.textContent = `Synced ${d.toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} ET · data through ${fmtShort(m.last_date)}`;
}

/* ----------------------------------------------------- quick select + cal */
function buildQuickSelect(){
  const el=document.getElementById("qsList");
  el.innerHTML = PRESETS.map(p=>`<div class="qs-item${p===S.preset?" active":""}" data-p="${p}">${p}</div>`).join("");
  el.querySelectorAll(".qs-item").forEach(it=>it.onclick=()=>{
    const p=it.dataset.p;
    S.preset=p;
    if(p==="Custom Range"){ S.pickStage=0; }
    else { const [a,b]=rangeFor(p); S.start=a; S.end=b;
           S.calMonth=new Date(parse(b).getFullYear(),parse(b).getMonth()-1,1);
           closePops(); }
    S.page=1;
    document.getElementById("dateLabel").textContent=p;
    buildQuickSelect(); buildCalendar(); render();
  });
  buildCalendar();
}

function buildCalendar(){
  const panel=document.getElementById("calPanel");
  const left=S.calMonth||new Date();
  const right=new Date(left.getFullYear(),left.getMonth()+1,1);
  panel.innerHTML = month(left,true)+month(right,false)+
    `<div class="cal-hint">${S.preset==="Custom Range"
      ? (S.pickStage===0?"Pick a start date":"Pick an end date")
      : "Pick any two dates to switch to a custom range"}</div>`;

  panel.querySelectorAll(".cal-nav").forEach(b=>b.onclick=()=>{
    S.calMonth=new Date(left.getFullYear(),left.getMonth()+Number(b.dataset.d),1);
    buildCalendar();
  });
  panel.querySelectorAll(".cal-day[data-d]").forEach(c=>c.onclick=()=>{
    const v=c.dataset.d;
    if(S.pickStage===0){ S.start=v; S.end=v; S.pickStage=1; }
    else {
      if(v<S.start){ S.end=S.start; S.start=v; } else { S.end=v; }
      S.pickStage=0; closePops();
    }
    S.preset="Custom Range"; S.page=1;
    document.getElementById("dateLabel").textContent =
      (S.start===S.end) ? fmtShort(S.start) : `${fmtShort(S.start)} – ${fmtShort(S.end)}`;
    buildQuickSelect(); buildCalendar(); render();
  });
}

function month(d, withPrev){
  const y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  const maxDate = S.data ? S.data.meta.last_date : iso(new Date());
  const minDate = S.data ? S.data.meta.first_date : "1970-01-01";
  let cells="";
  for(let i=0;i<first;i++) cells+=`<div class="cal-day blank"></div>`;
  for(let day=1;day<=n;day++){
    const v=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const out = v>maxDate || v<minDate;
    const sel = v===S.start || v===S.end;
    const inr = !sel && S.start && S.end && v>S.start && v<S.end;
    cells+=`<div class="cal-day${out?" dim":""}${sel?" sel":""}${inr?" inrange":""}"
      ${out?"":`data-d="${v}"`}>${day}</div>`;
  }
  return `<div>
    <div class="cal-head">
      ${withPrev?'<button class="cal-nav" data-d="-1">‹</button>':'<span style="width:22px"></span>'}
      <span>${MONTHS[m]} ${y}</span>
      ${withPrev?'<span style="width:22px"></span>':'<button class="cal-nav" data-d="1">›</button>'}
    </div>
    <div class="cal-grid">
      ${WD.map(w=>`<div class="cal-wd">${w}</div>`).join("")}${cells}
    </div>
  </div>`;
}

/* ------------------------------------------------------------- locations */
function buildLocations(filterText){
  const el=document.getElementById("locList");
  const counts=new Map();
  for(const r of S.data.rows) counts.set(r[F.LOC], (counts.get(r[F.LOC])||0)+1);
  const q=(filterText||"").toLowerCase();
  const entries=Object.entries(S.data.locations)
    .filter(([,n])=>!q || n.toLowerCase().includes(q))
    .sort((a,b)=>(counts.get(b[0])||0)-(counts.get(a[0])||0));
  el.innerHTML = entries.length ? entries.map(([id,name])=>`
    <div class="loc-item${S.locs.has(id)?" on":""}" data-id="${esc(id)}">
      <span class="cbx">${S.locs.has(id)?"✓":""}</span>
      <span>${esc(name)}</span>
      <span class="n">${(counts.get(id)||0).toLocaleString()}</span>
    </div>`).join("") : `<div class="empty" style="padding:24px">No matches</div>`;
  el.querySelectorAll(".loc-item").forEach(it=>it.onclick=()=>{
    const id=it.dataset.id;
    S.locs.has(id) ? S.locs.delete(id) : S.locs.add(id);
    S.page=1; buildLocations(document.getElementById("locSearch").value);
    updateLocLabel(); render();
  });
}
function updateLocLabel(){
  const el=document.getElementById("locLabel");
  const n=S.locs.size;
  el.textContent = n===0 ? "All Locations"
    : n===1 ? (S.data.locations[[...S.locs][0]] || "1 Location")
    : `${n} Locations`;
}

/* ------------------------------------------------------------- popovers */
function closePops(){
  document.getElementById("datePop").classList.remove("open");
  document.getElementById("locPop").classList.remove("open");
  document.getElementById("dateBtn").setAttribute("aria-expanded","false");
  document.getElementById("locBtn").setAttribute("aria-expanded","false");
}
function toggle(popId, btnId){
  const pop=document.getElementById(popId), btn=document.getElementById(btnId);
  const open=pop.classList.contains("open");
  closePops();
  if(!open){ pop.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
}
document.getElementById("dateBtn").onclick = e => { e.stopPropagation(); toggle("datePop","dateBtn"); };
document.getElementById("locBtn").onclick  = e => { e.stopPropagation(); toggle("locPop","locBtn"); };
document.getElementById("datePop").onclick = e => e.stopPropagation();
document.getElementById("locPop").onclick  = e => e.stopPropagation();
document.addEventListener("click", closePops);
document.addEventListener("keydown", e => { if(e.key==="Escape") closePops(); });
document.getElementById("locSearch").oninput = e => buildLocations(e.target.value);
document.getElementById("locAll").onclick = () => {
  Object.keys(S.data.locations).forEach(id=>S.locs.add(id));
  S.page=1; buildLocations(document.getElementById("locSearch").value); updateLocLabel(); render();
};
document.getElementById("locNone").onclick = () => {
  S.locs.clear(); S.page=1;
  buildLocations(document.getElementById("locSearch").value); updateLocLabel(); render();
};

load();
</script>
